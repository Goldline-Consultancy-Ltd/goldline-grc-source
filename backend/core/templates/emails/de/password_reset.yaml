subject: "Goldline GRC: Passwort zurücksetzen"
body: |
  <img src="${ciso_assistant_url}/goldline-grc-mark-512.png" alt="Goldline GRC" width="72">

  **Ihre zentrale GRC-Managementplattform**

  Hallo,

  Für diese E-Mail-Adresse wurde das Zurücksetzen des Passworts angefordert. Klicken Sie auf den folgenden Link, um fortzufahren:

  [Passwort zurücksetzen](${reset_password_url})

  Falls der Link nicht funktioniert, kopieren Sie die folgende Adresse in Ihren Browser:
  ${reset_password_url}

  Dieser Link kann nur einmal verwendet werden. Falls er abgelaufen ist, öffnen Sie [Ihre Instanz](${ciso_assistant_url}) und fordern Sie erneut das Zurücksetzen des Passworts an.

  Falls weder Sie noch Ihre Organisation diese Anfrage gestellt haben, können Sie diese E-Mail ignorieren.

  Weitere Informationen über Goldline Consultancy finden Sie [hier](https://goldlineconsultancy.co.uk/).

  Freundliche Grüße
  Goldline GRC
  Goldline Consultancy · grc@goldlineconsultancy.co.uk · goldlineconsultancy.co.uk