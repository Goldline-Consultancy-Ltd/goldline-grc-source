subject: "Goldline GRC: You have ${control_count} expired control(s)"
body: |
  Hello,

  The following controls have expired:

  ${control_list}

  This reminder will stop once the control is marked as active or you update the ETA.
  Log in to your Goldline GRC portal and check 'my assignments' section to get to your controls directly: [Go to Goldline GRC](${ciso_assistant_url})

  Thank you.
