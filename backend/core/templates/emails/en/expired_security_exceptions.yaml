subject: "Goldline GRC: Security exception expired since ${expired_since} day(s)"
body: |
  Hello,

  You have ${exception_count} security exception(s) expired since ${expired_since} day(s):

  ${exception_list}

  Please log in to your Goldline GRC portal to review and update these security exceptions: [Go to Goldline GRC](${ciso_assistant_url})

  Thank you.
