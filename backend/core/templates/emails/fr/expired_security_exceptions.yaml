subject: "Goldline GRC: Dérogation de sécurité expirée depuis ${expired_since} jour(s)"
body: |
  Bonjour,

  Vous avez ${exception_count} dérogation(s) de sécurité expirée(s) depuis ${expired_since} jour(s) :

