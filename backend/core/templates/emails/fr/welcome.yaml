subject: "Bienvenue sur Goldline GRC !"
body: |
  <img src="${ciso_assistant_url}/goldline-grc-mark-512.png" alt="Goldline GRC" width="72">

  ## Bienvenue sur Goldline GRC !

  **Votre plateforme de gestion GRC tout-en-un**

  Un accès à Goldline GRC vous a été accordé. Pour commencer, utilisez le lien ci-dessous pour définir votre mot de passe :

  [Définir mon mot de passe](${set_password_url})

  En cas de problème avec le lien, copiez et collez l'URL suivante dans votre navigateur :
  ${set_password_url}

  Ce lien ne peut être utilisé qu'une seule fois. S'il a expiré, rendez-vous sur [votre instance](${ciso_assistant_url}) et demandez une réinitialisation de mot de passe.

  Si vous, ou votre organisation, n'avez pas fait cette demande, vous pouvez simplement ignorer cet email.

  En savoir plus sur Goldline Consultancy [ici](https://goldlineconsultancy.co.uk/).

  Cordialement,
  Goldline GRC
  Goldline Consultancy · grc@goldlineconsultancy.co.uk · goldlineconsultancy.co.uk